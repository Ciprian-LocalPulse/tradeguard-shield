services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 8080
      ALLOWED_CORS_ORIGINS: http://localhost:5173,chrome-extension://*
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/dashboard.Dockerfile
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
