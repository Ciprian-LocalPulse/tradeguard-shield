services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_PORT: 8080
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard.Dockerfile
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
